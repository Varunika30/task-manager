{% extends "base.html" %}
{% block title %}Tasks{% endblock %}
{% block content %}
<div class="section-head">
  <h1>All tasks</h1>
</div>
<div class="toolbar">
  <div class="filters" id="filters">
    <button class="chip-btn active" data-filter="all">All</button>
    <button class="chip-btn" data-filter="Pending">Pending</button>
    <button class="chip-btn" data-filter="Awaiting Proof">Awaiting proof</button>
    <button class="chip-btn" data-filter="Completed">Completed</button>
    <button class="chip-btn" data-filter="overdue">Overdue</button>
  </div>
  <input type="search" id="searchBox" placeholder="Search tasks…" aria-label="Search tasks">
</div>
<div id="taskList" class="task-list"></div>
{% endblock %}
