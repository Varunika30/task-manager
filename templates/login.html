<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · TaskNest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%85%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light'; } catch (e) {}</script>
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-hero">
      <div class="brand-logo big">✅</div>
      <h1>TaskNest</h1>
      <p>Finish tasks, show your proof, earn rewards and take mindful breaks.</p>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" data-mode="login" role="tab">Sign in</button>
      <button class="tab" data-mode="register" role="tab">Create account</button>
    </div>

    <form id="authForm" autocomplete="on">
      <label id="nameField" hidden>Your name
        <input name="name" maxlength="60" placeholder="e.g. Nila" autocomplete="name">
      </label>
      <label>Email
        <input type="email" name="email" required placeholder="you@example.com" autocomplete="email">
      </label>
      <label>Password
        <input type="password" name="password" required minlength="6" placeholder="At least 6 characters" autocomplete="current-password">
      </label>
      <p class="form-error" id="authError" hidden></p>
      <button class="btn primary block" type="submit" id="authSubmit">Sign in</button>
    </form>
    <p class="muted center-text small">Demo account: <b>demo@example.com</b> / <b>demo1234</b></p>
  </div>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
